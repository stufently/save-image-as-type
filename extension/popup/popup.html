<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title data-i18n="popupTitle">Save Image As Type</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1 data-i18n="popupTitle">Save Image As Type</h1>
    <p class="subtitle" data-i18n="popupSubtitle">Right-click any image to save in your preferred format</p>

    <div class="section">
      <label for="defaultFormat" data-i18n="popupDefaultFormat">Default format</label>
      <select id="defaultFormat">
        <option value="png" data-i18n="popupFormatPng">PNG (lossless, transparency)</option>
        <option value="jpg" data-i18n="popupFormatJpg">JPG (smaller, no transparency)</option>
        <option value="webp" data-i18n="popupFormatWebp">WebP (modern, small size)</option>
      </select>
    </div>

    <div class="section">
      <label for="jpgQuality"><span data-i18n="popupJpgQuality">JPG quality</span>: <span id="jpgQualityValue">92</span>%</label>
      <input type="range" id="jpgQuality" min="10" max="100" value="92" step="1">
    </div>

    <div class="section">
      <label for="webpQuality"><span data-i18n="popupWebpQuality">WebP quality</span>: <span id="webpQualityValue">90</span>%</label>
      <input type="range" id="webpQuality" min="10" max="100" value="90" step="1">
    </div>

    <div id="status" class="status hidden"></div>

    <div class="footer">
      <p><span data-i18n="popupTip">Tip: Right-click any image on a webpage and select</span><br><strong data-i18n="popupTipMenu">Save Image As &rarr; Format</strong></p>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
