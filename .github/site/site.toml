[[faq]]
q = "How do I convert a WebP image to PNG or JPG in Chrome?"
a = "Install the extension, right-click the image, choose Save Image As and pick PNG, JPG or WebP. The Save As dialog opens so you choose where the file goes."

[[faq]]
q = "Are my images uploaded to a server?"
a = "No. The image is decoded, drawn to a canvas and re-encoded with the browser's own Canvas API inside an offscreen document. There is no backend, no upload endpoint, no analytics and no account."

[[faq]]
q = "Why is there no AVIF option?"
a = "AVIF was removed in v1.2.0: Chrome's canvas.toBlob() cannot encode image/avif, so the option could never work client-side."

[[faq]]
q = "Does it work in Edge, Opera or other Chromium browsers?"
a = "The extension is Manifest V3 and the same ZIP works in Edge and Opera. It is not published in Edge Add-ons or Opera Add-ons yet, so download the ZIP from GitHub Releases and load it unpacked from the extensions page with Developer mode on."

[[faq]]
q = "Why does it need access to all sites?"
a = "The extension has to fetch the image you right-clicked, and that image can live on any domain. The scripting permission is used only to read a blob: image URL from the page that created it."

[[faq]]
q = "What settings does it store?"
a = "Three values in chrome.storage.sync: defaultFormat, jpgQuality and webpQuality. Nothing about which images you saved, which sites you visited or who you are."
